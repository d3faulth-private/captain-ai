[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captain-assistant"
version = "0.2.0a1"
description = "Local-first voice assistant with supervised, scoped background jobs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2", "sounddevice>=0.5,<1", "numpy>=1.26,<3", "piper-tts>=1.3,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
captain = "captain.cli:main"

[tool.setuptools.packages.find]
include = ["captain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
